apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-dev
  namespace: argocd
  # 2026-11-10 (감사 M4): storage 네임스페이스 이전 준비 — finalizer 를 빼서 이 Application 을
  # 지워도 MinIO 자원(StatefulSet·PVC·Secret)이 연쇄 삭제되지 않게 하고, auto-sync 를 꺼서
  # 전환 중 selfHeal 이 되돌리지 않게 한다. 다음 커밋에서 이 파일 자체를 삭제한다.
spec:
  project: default
  source:
    repoURL: https://github.com/miginho12/gitops
    targetRevision: main
    path: apps/minio
    helm:
      releaseName: minio
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
