apiVersion: v1
kind: Service
metadata:
  name: {{ include "clog.fullname" . }}
  labels:
    {{- include "clog.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    # API Pod 만 (감사 M12) — 전엔 worker 도 endpoints 에 들어갔다(포트 이름이 없어 트래픽만 안 갔을 뿐)
    {{- include "clog.apiSelectorLabels" . | nindent 4 }}
