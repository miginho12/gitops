apiVersion: v2
name: monitoring
description: Monitoring stack - Prometheus + Grafana + AlertManager + Loki + Discord
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    # 2026-11-14 86.2.3 → 92.17.0(operator 0.94.2, 10-31 배포 — 93.3.0 은 1일차라 보류). 업그레이드 노트: 87·88·91 CRD(ArgoCD SSA 가 갱신),
    # 90 control-plane ServiceMonitor 인증 → authorization(SA 토큰 Secret 자동 생성), 92 nodeSelector linux(재시작 1회)
    version: "92.17.0"
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki
    # 2026-11-14 grafana/helm-charts 6.16.0(Loki 3.1.1) → grafana-community 20.2.1(Loki 3.7.9, 10-31 배포).
    # grafana 저장소의 loki 7.x 는 Enterprise Logs(GEL) 전용 — OSS 차트는 2026-03 community 로 이전(ADR-100).
    # StatefulSet serviceName·selector·volumeClaimTemplates 동일(렌더 비교) → 롤링, PVC 유지.
    version: "20.2.1"
    repository: https://grafana-community.github.io/helm-charts
  - name: promtail
    version: "6.16.6"
    repository: https://grafana.github.io/helm-charts
