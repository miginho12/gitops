# promtool 룰 단위 테스트 — scripts/test-monitoring-rules.sh 가 실행한다 (로컬·CI 동일).
# rule_files 는 렌더된 PrometheusRule 이름별 파일 (스크립트가 templates/prometheus-rules.yaml 에서 추출).
# 주의: 여기 시리즈 이름은 "가정"이다 — 지표 이름이 실제로 있는지는 이 테스트로 못 잡는다.
rule_files: [infra-alerts.yaml, clog-service-alerts.yaml]
evaluation_interval: 1m
tests:
  # ── ClogBackupReplicaStale / MetricMissing ──
  # ack 시각이 0 에 고정 = 이후 pull 없음 (node-exporter 는 매 스크레이프 노출 → 1m 간격으로 재현)
  - interval: 1m
    input_series:
      - series: 'clog_backup_replica_last_success_timestamp_seconds{ns="prod"}'
        values: '0x4400'
    alert_rule_test:
      - {eval_time: 71h,   alertname: ClogBackupReplicaStale, exp_alerts: []}   # 72h 전
      - {eval_time: 72h5m, alertname: ClogBackupReplicaStale, exp_alerts: []}   # 넘었지만 for 10m 대기
      - eval_time: 72h15m
        alertname: ClogBackupReplicaStale
        exp_alerts:
          - exp_labels: {severity: warning, category: infra, ns: prod}
            exp_annotations:
              summary: "DB 백업 외부 복제가 72시간 넘게 멈춤 (prod)"
              description: "노트북이 마지막으로 사본을 저장한 지 3d 0h 15m 0s. 노트북 작업 스케줄러 clog-backup-pull·pull.log 확인."
      - {eval_time: 72h15m, alertname: ClogBackupReplicaMetricMissing, exp_alerts: []}
  # 매일 ack 갱신되는 정상 상태 → 안 울림
  - interval: 1m
    input_series:
      - series: 'clog_backup_replica_last_success_timestamp_seconds{ns="prod"}'
        values: '0x1439 86400x1439 172800x1439 259200x1439'
    alert_rule_test:
      - {eval_time: 95h, alertname: ClogBackupReplicaStale, exp_alerts: []}
  # 지표 없음 → 1h 뒤 Missing
  - interval: 1m
    input_series: []
    alert_rule_test:
      - {eval_time: 50m, alertname: ClogBackupReplicaMetricMissing, exp_alerts: []}
      - eval_time: 61m
        alertname: ClogBackupReplicaMetricMissing
        exp_alerts:
          - exp_labels: {severity: warning, category: infra}
            exp_annotations:
              summary: "DB 백업 외부 복제 지표 없음"
              description: "clog_backup_replica_last_success_timestamp_seconds 가 1시간째 없음. /var/lib/node_exporter/textfile_collector/clog_backup_replica.prom 과 node-exporter --collector.textfile.directory 확인."

  # ── ClogSealedKeysBackupStale / MetricMissing (H4) ──
  # 옛 키 생성 t=0, 새 키 t=1d 에 생성, 노트북 번들은 계속 옛 키(0)까지만 → 새 키 + 72h = 96h 초과, for 10m
  - interval: 1m
    input_series:
      - series: 'kube_secret_created{namespace="sealed-secrets",secret="sealed-secrets-keyold"}'
        values: '0x6000'
      - series: 'kube_secret_created{namespace="sealed-secrets",secret="sealed-secrets-keynew"}'
        values: '_x1440 86400x4560'
      - series: 'clog_sealed_keys_backup_newest_key_timestamp_seconds'
        values: '0x6000'
    alert_rule_test:
      - {eval_time: 95h,   alertname: ClogSealedKeysBackupStale, exp_alerts: []}   # 새 키 후 71h
      - {eval_time: 96h5m, alertname: ClogSealedKeysBackupStale, exp_alerts: []}   # 넘었지만 for 10m 대기
      - eval_time: 96h15m
        alertname: ClogSealedKeysBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, category: infra}
            exp_annotations:
              summary: "sealed-secrets 새 마스터 키가 72시간 넘게 외부 백업 안 됨"
              description: "가장 최신 키가 만들어진 지 3d 0h 15m 0s 지났지만 노트북 번들에 없음. 노트북 pull.log 의 KEYS 줄과 Pi exports.log 의 keys/ack-keys 확인."
      - {eval_time: 96h15m, alertname: ClogSealedKeysBackupMetricMissing, exp_alerts: []}
  # 새 키가 하루 뒤(t=2d) 백업됨 → 안 울림
  - interval: 1m
    input_series:
      - series: 'kube_secret_created{namespace="sealed-secrets",secret="sealed-secrets-keyold"}'
        values: '0x6000'
      - series: 'kube_secret_created{namespace="sealed-secrets",secret="sealed-secrets-keynew"}'
        values: '_x1440 86400x4560'
      - series: 'clog_sealed_keys_backup_newest_key_timestamp_seconds'
        values: '0x2880 86400x3120'
    alert_rule_test:
      - {eval_time: 100h, alertname: ClogSealedKeysBackupStale, exp_alerts: []}
  # 새 키 없음 — 최신 키가 아무리 오래돼도 번들에 있으면 안 울림 (시간 조건만 있으면 매달 오탐)
  - interval: 1m
    input_series:
      - series: 'kube_secret_created{namespace="sealed-secrets",secret="sealed-secrets-keyold"}'
        values: '0x7000'
      - series: 'clog_sealed_keys_backup_newest_key_timestamp_seconds'
        values: '0x7000'
    alert_rule_test:
      - {eval_time: 110h, alertname: ClogSealedKeysBackupStale, exp_alerts: []}
  # 지표 없음 → 1h 뒤 Missing
  - interval: 1m
    input_series:
      - series: 'kube_secret_created{namespace="sealed-secrets",secret="sealed-secrets-keyold"}'
        values: '0x100'
    alert_rule_test:
      - {eval_time: 50m, alertname: ClogSealedKeysBackupMetricMissing, exp_alerts: []}
      - eval_time: 61m
        alertname: ClogSealedKeysBackupMetricMissing
        exp_alerts:
          - exp_labels: {severity: warning, category: infra}
            exp_annotations:
              summary: "sealed-secrets 키 백업 지표 없음"
              description: "clog_sealed_keys_backup_newest_key_timestamp_seconds 가 1시간째 없음. /var/lib/node_exporter/textfile_collector/clog_sealed_keys_backup.prom 확인."
  # ── LokiCompactorNotRunning / MetricMissing (M5) ──
  # 프로세스는 t=0 에 시작, 보존 적용 성공이 한 번도 없음(지표 0) → 뜬 지 3h 초과 + for 15m
  - interval: 1m
    input_series:
      - series: 'loki_compactor_apply_retention_last_successful_run_timestamp_seconds{job="monitoring/monitoring-loki"}'
        values: '0x300'
      - series: 'process_start_time_seconds{job="monitoring/monitoring-loki"}'
        values: '0x300'
    alert_rule_test:
      - {eval_time: 3h,    alertname: LokiCompactorNotRunning, exp_alerts: []}
      - {eval_time: 3h10m, alertname: LokiCompactorNotRunning, exp_alerts: []}   # 넘었지만 for 15m 대기
      - eval_time: 3h20m
        alertname: LokiCompactorNotRunning
        exp_alerts:
          - exp_labels: {severity: warning, category: infra}
            exp_annotations:
              summary: "Loki 보존 적용이 3시간 넘게 성공하지 못함 — 오래된 로그 삭제 멈춤"
              description: "마지막 보존 적용 성공 후 3시간 넘게 지남. 오래된 로그가 지워지지 않아 디스크가 계속 찬다. kubectl -n monitoring logs monitoring-loki-0 -c loki | grep compactor 확인."
      - {eval_time: 3h20m, alertname: LokiCompactorMetricMissing, exp_alerts: []}
  # 재시작: t=10h 에 새로 뜸 → 지표 0 으로 초기화, 20분 뒤부터 10분마다 성공 → 안 울림 (재시작 오탐 방지)
  - interval: 10m
    input_series:
      - series: 'loki_compactor_apply_retention_last_successful_run_timestamp_seconds{job="monitoring/monitoring-loki"}'
        values: '0+600x59 0 0 37200+600x40'
      - series: 'process_start_time_seconds{job="monitoring/monitoring-loki"}'
        values: '0x59 36000x42'
    alert_rule_test:
      - {eval_time: 10h15m, alertname: LokiCompactorNotRunning, exp_alerts: []}
      - {eval_time: 13h30m, alertname: LokiCompactorNotRunning, exp_alerts: []}
  # 지표 없음 → 1h 뒤 Missing
  - interval: 1m
    input_series:
      - series: 'up{job="monitoring/monitoring-loki"}'
        values: '1x100'
    alert_rule_test:
      - {eval_time: 50m, alertname: LokiCompactorMetricMissing, exp_alerts: []}
      - eval_time: 61m
        alertname: LokiCompactorMetricMissing
        exp_alerts:
          - exp_labels: {severity: warning, category: infra}
            exp_annotations:
              summary: "Loki compactor 지표 없음"
              description: "loki_compactor_apply_retention_last_successful_run_timestamp_seconds 가 1시간째 없음. Loki 스크레이프(up{job=\"monitoring/monitoring-loki\"}) 또는 compactor 설정 확인."
  # ── ClogLogBackupStale / MetricMissing (M5) ──
  # 가장 최근 날 = 0 (UTC 00:00) 고정, 이후 pull 없음 → 4일 초과 + for 10m
  - interval: 1m   # node-exporter 는 매 스크레이프 노출 — 5m lookback 보다 긴 간격이면 pending 이 끊긴다
    input_series:
      - series: 'clog_log_backup_newest_day_timestamp_seconds'
        values: '0x6000'
    alert_rule_test:
      - {eval_time: 96h,    alertname: ClogLogBackupStale, exp_alerts: []}
      - {eval_time: 96h10m, alertname: ClogLogBackupStale, exp_alerts: []}   # 넘었지만 for 10m 대기
      - eval_time: 96h20m
        alertname: ClogLogBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, category: infra}
            exp_annotations:
              summary: "prod 로그 외부 백업이 4일 넘게 멈춤 — Loki 보존(7일) 전에 받아야 함"
              description: "노트북에 있는 가장 최근 로그 날짜가 4d 0h 20m 0s 전. 노트북 pull.log 의 LOGS 줄과 Pi exports.log 의 logs/ack-logs 확인."
      - {eval_time: 96h20m, alertname: ClogLogBackupMetricMissing, exp_alerts: []}
  # 매일 하루씩 전진 → 안 울림
  - interval: 1m
    input_series:
      - series: 'clog_log_backup_newest_day_timestamp_seconds'
        values: '0x1440 86400x1440 172800x1440 259200x1440 345600x1440 432000x1440'
    alert_rule_test:
      - {eval_time: 140h, alertname: ClogLogBackupStale, exp_alerts: []}
  # 지표 없음 → 1h 뒤 Missing
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter"}'
        values: '1x100'
    alert_rule_test:
      - {eval_time: 50m, alertname: ClogLogBackupMetricMissing, exp_alerts: []}
      - eval_time: 61m
        alertname: ClogLogBackupMetricMissing
        exp_alerts:
          - exp_labels: {severity: warning, category: infra}
            exp_annotations:
              summary: "prod 로그 백업 지표 없음"
              description: "clog_log_backup_newest_day_timestamp_seconds 가 1시간째 없음. /var/lib/node_exporter/textfile_collector/clog_log_backup.prom 확인."
  # ── ClogTfstateBackupStale / MetricMissing (H5) ──
  # ack 시각이 0 에 고정 = 이후 pull 없음 → 72h 초과 + for 10m
  - interval: 1m
    input_series:
      - series: 'clog_tfstate_backup_last_success_timestamp_seconds{stack="uptime"}'
        values: '0x4400'
      - series: 'clog_tfstate_backup_last_success_timestamp_seconds{stack="cloudflare"}'
        values: '0+60x4400'   # cloudflare 는 매분 ack(정상) → uptime 만 울려야 한다
    alert_rule_test:
      - {eval_time: 71h,   alertname: ClogTfstateBackupStale, exp_alerts: []}
      - {eval_time: 72h5m, alertname: ClogTfstateBackupStale, exp_alerts: []}   # 넘었지만 for 10m 대기
      - eval_time: 72h15m
        alertname: ClogTfstateBackupStale
        exp_alerts:
          - exp_labels: {severity: warning, category: infra, stack: uptime}
            exp_annotations:
              summary: "Terraform state 외부 백업이 72시간 넘게 멈춤 (uptime)"
              description: "노트북이 마지막으로 state 사본을 확인한 지 3d 0h 15m 0s. 노트북 pull.log 의 TFSTATE 줄과 Pi exports.log 의 tfstate/ack-tfstate 확인."
      - {eval_time: 72h15m, alertname: ClogTfstateBackupMetricMissing, exp_alerts: []}
  # 매일 ack(내용이 같아 SKIP 이어도) → 안 울림
  - interval: 1m
    input_series:
      - series: 'clog_tfstate_backup_last_success_timestamp_seconds{stack="uptime"}'
        values: '0x1439 86400x1439 172800x1439 259200x1439'
      - series: 'clog_tfstate_backup_last_success_timestamp_seconds{stack="cloudflare"}'
        values: '0x1439 86400x1439 172800x1439 259200x1439'
    alert_rule_test:
      - {eval_time: 95h, alertname: ClogTfstateBackupStale, exp_alerts: []}
      - {eval_time: 95h, alertname: ClogTfstateBackupMetricMissing, exp_alerts: []}
  # 지표 없음 → 1h 뒤 Missing
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter"}'
        values: '1x100'
    alert_rule_test:
      - {eval_time: 50m, alertname: ClogTfstateBackupMetricMissing, exp_alerts: []}
      - eval_time: 61m
        alertname: ClogTfstateBackupMetricMissing
        exp_alerts:   # 둘 다 없음 → stack 마다 1건
          - exp_labels: {severity: warning, category: infra, stack: uptime}
            exp_annotations:
              summary: "Terraform state 백업 지표 없음 (uptime)"
              description: "clog_tfstate_backup_last_success_timestamp_seconds{stack=\"uptime\"} 가 1시간째 없음. /var/lib/node_exporter/textfile_collector/clog_tfstate_backup_uptime.prom 과 노트북 pull.log 의 TFSTATE 줄 확인."
          - exp_labels: {severity: warning, category: infra, stack: cloudflare}
            exp_annotations:
              summary: "Terraform state 백업 지표 없음 (cloudflare)"
              description: "clog_tfstate_backup_last_success_timestamp_seconds{stack=\"cloudflare\"} 가 1시간째 없음. /var/lib/node_exporter/textfile_collector/clog_tfstate_backup_cloudflare.prom 과 노트북 pull.log 의 TFSTATE 줄 확인."
  # cloudflare 지표만 없음(새 stack 을 ps1 에 안 넣은 경우) → cloudflare 만 Missing — 이름 없는 absent() 였다면 조용했을 경우
  - interval: 1m
    input_series:
      - series: 'clog_tfstate_backup_last_success_timestamp_seconds{stack="uptime"}'
        values: '0+60x100'
    alert_rule_test:
      - eval_time: 61m
        alertname: ClogTfstateBackupMetricMissing
        exp_alerts:
          - exp_labels: {severity: warning, category: infra, stack: cloudflare}
            exp_annotations:
              summary: "Terraform state 백업 지표 없음 (cloudflare)"
              description: "clog_tfstate_backup_last_success_timestamp_seconds{stack=\"cloudflare\"} 가 1시간째 없음. /var/lib/node_exporter/textfile_collector/clog_tfstate_backup_cloudflare.prom 과 노트북 pull.log 의 TFSTATE 줄 확인."
