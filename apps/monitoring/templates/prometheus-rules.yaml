# ============================================================
# 진호님 커스텀 알람 정책 (Day 15)
# ============================================================

# ── 인프라 알람 (category=infra) ──
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infra-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring
spec:
  groups:
    - name: infra
      interval: 30s
      rules:
        # 디스크 80% 이상
        - alert: HighDiskUsage
          expr: |
            (1 - (node_filesystem_avail_bytes{fstype!="tmpfs",fstype!="overlay"} 
                  / node_filesystem_size_bytes{fstype!="tmpfs",fstype!="overlay"})) > 0.8
          for: 10m
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "디스크 사용량 80% 초과 - {{`{{ $labels.mountpoint }}`}}"
            description: "노드 {{`{{ $labels.instance }}`}} 의 {{`{{ $labels.mountpoint }}`}} 디스크 사용량 {{`{{ $value | humanizePercentage }}`}}"
        
        # 메모리 80%
        - alert: HighMemoryUsage
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
          for: 15m
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "라즈베리파이 메모리 사용량 80% 초과"
            description: "노드 {{`{{ $labels.instance }}`}} 메모리 사용량 {{`{{ $value | humanizePercentage }}`}}"
        
        # CPU 80% sustained
        - alert: HighCPUUsage
          expr: |
            (1 - rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.8
          for: 15m
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "CPU 사용량 80% 지속"
            description: "노드 {{`{{ $labels.instance }}`}} CPU 사용량 {{`{{ $value | humanizePercentage }}`}} (15분 지속)"

        # DB 백업 외부 복제(노트북) 신선도. 노트북이 검증·저장 후 ack 한 시각을 backup-export.sh 가
        # textfile 지표로 남긴다. 노트북은 매일 09:00·로그온 시 pull → 72h 면 주말 꺼짐은 넘기고
        # 그 이상 끊기면 알림. 노드를 잃으면 노트북 사본이 유일한 백업이라 끊긴 걸 알아야 한다.
        - alert: ClogBackupReplicaStale
          expr: |
            time() - clog_backup_replica_last_success_timestamp_seconds > 72 * 3600
          for: 10m
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "DB 백업 외부 복제가 72시간 넘게 멈춤 ({{`{{ $labels.ns }}`}})"
            description: "노트북이 마지막으로 사본을 저장한 지 {{`{{ $value | humanizeDuration }}`}}. 노트북 작업 스케줄러 clog-backup-pull·pull.log 확인."

        # 지표 자체가 없음 = .prom 파일 삭제 / textfile collector 설정 빠짐 / node-exporter 다운
        - alert: ClogBackupReplicaMetricMissing
          expr: |
            absent(clog_backup_replica_last_success_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "DB 백업 외부 복제 지표 없음"
            description: "clog_backup_replica_last_success_timestamp_seconds 가 1시간째 없음. /var/lib/node_exporter/textfile_collector/clog_backup_replica.prom 과 node-exporter --collector.textfile.directory 확인."

        # sealed-secrets 마스터 키 외부 백업 (2026-11-09, 감사 H4). 컨트롤러가 30일마다 새 키를 만들므로
        # "클러스터의 최신 키(kube-state-metrics) > 노트북 번들의 최신 키(ack textfile)" 가 72h 지속되면 알림.
        # 키 하나라도 빠지면 그 키로 봉인된 SealedSecret 은 복구 불가(11-09 실측: 18개 전부 첫 키로 봉인 —
        # 최신 키만 있으면 0/18). 노트북이 매일 keys → 검증 → ack-keys (scripts/backup-export.sh).
        - alert: ClogSealedKeysBackupStale
          expr: |
            (time() - max(kube_secret_created{namespace="sealed-secrets", secret=~"sealed-secrets-key.+"}) > 72 * 3600)
            and on ()
            (max(kube_secret_created{namespace="sealed-secrets", secret=~"sealed-secrets-key.+"})
              > max(clog_sealed_keys_backup_newest_key_timestamp_seconds))
          for: 10m
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "sealed-secrets 새 마스터 키가 72시간 넘게 외부 백업 안 됨"
            description: "가장 최신 키가 만들어진 지 {{`{{ $value | humanizeDuration }}`}} 지났지만 노트북 번들에 없음. 노트북 pull.log 의 KEYS 줄과 Pi exports.log 의 keys/ack-keys 확인."

        - alert: ClogSealedKeysBackupMetricMissing
          expr: |
            absent(clog_sealed_keys_backup_newest_key_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "sealed-secrets 키 백업 지표 없음"
            description: "clog_sealed_keys_backup_newest_key_timestamp_seconds 가 1시간째 없음. /var/lib/node_exporter/textfile_collector/clog_sealed_keys_backup.prom 확인."

        # ── prod 로그 외부 백업 (2026-11-10, 감사 M5) ──
        # 노트북이 매일 어제(UTC) 로그를 받아 ack → newest_day 는 평소 1~2일 전. Loki 보존이 7일이라
        # 4일이면 아직 받을 수 있는 날이 남아 있을 때 알린다 (노트북 pull.log 의 LOGS 줄 확인).
        - alert: ClogLogBackupStale
          expr: |
            time() - max(clog_log_backup_newest_day_timestamp_seconds) > 4 * 86400
          for: 10m
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "prod 로그 외부 백업이 4일 넘게 멈춤 — Loki 보존(7일) 전에 받아야 함"
            description: "노트북에 있는 가장 최근 로그 날짜가 {{`{{ $value | humanizeDuration }}`}} 전. 노트북 pull.log 의 LOGS 줄과 Pi exports.log 의 logs/ack-logs 확인."

        - alert: ClogLogBackupMetricMissing
          expr: |
            absent(clog_log_backup_newest_day_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "prod 로그 백업 지표 없음"
            description: "clog_log_backup_newest_day_timestamp_seconds 가 1시간째 없음. /var/lib/node_exporter/textfile_collector/clog_log_backup.prom 확인."

        # ── Loki 보존 삭제 동작 감시 (2026-11-10, 감사 M5) ──
        # 보존 삭제는 compactor 실행(10분 주기) 안에서 일어난다. 설정만 있고 실제로 안 지워지던 상태가
        # 144일간 아무도 모르게 지속됐다 → "마지막 성공 실행" 이 3시간 넘게 멈추면 알린다.
        # local-path PV 의 20Gi 는 강제되지 않아 Loki 는 노드 디스크를 끝까지 쓸 수 있다(HighDiskUsage 가 최후 방어선).
        - alert: LokiCompactorNotRunning
          # 재시작 직후엔 지표가 0 → 뜬 지 3h 넘은 경우만 판정 (0 이 계속이면 그때 울림)
          expr: |
            (time() - max(loki_compactor_apply_retention_last_successful_run_timestamp_seconds) > 3 * 3600)
            and on ()
            (time() - max(process_start_time_seconds{job="monitoring/monitoring-loki"}) > 3 * 3600)
          for: 15m
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "Loki 보존 적용이 3시간 넘게 성공하지 못함 — 오래된 로그 삭제 멈춤"
            description: "마지막 보존 적용 성공 후 3시간 넘게 지남. 오래된 로그가 지워지지 않아 디스크가 계속 찬다. kubectl -n monitoring logs monitoring-loki-0 -c loki | grep compactor 확인."

        - alert: LokiCompactorMetricMissing
          expr: |
            absent(loki_compactor_apply_retention_last_successful_run_timestamp_seconds)
          for: 1h
          labels:
            severity: warning
            category: infra
          annotations:
            summary: "Loki compactor 지표 없음"
            description: "loki_compactor_apply_retention_last_successful_run_timestamp_seconds 가 1시간째 없음. Loki 스크레이프(up{job=\"monitoring/monitoring-loki\"}) 또는 compactor 설정 확인."

# ── 클로그 서비스 알람 (category=service) ──
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: clog-service-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring
spec:
  groups:
    - name: clog-service
      interval: 30s
      rules:
        # HTTP 5xx 에러율 > 5% (5분간 5xx 3건 이상일 때만)
        # starlette_prometheus 는 status_code 를 starlette_responses_total 에만 붙인다
        # (requests_total 엔 없음 → 예전 식은 항상 빈 결과라 한 번도 발화 불가였음).
        # /metrics·헬스체크가 요청의 대부분이라 분모에서 빼야 실제 API 에러율이 된다.
        # 저트래픽이라 비율만 보면 500 한 번에도 울려서 최소 건수(>=3)를 함께 건다.
        - alert: ClogHighErrorRate
          expr: |
            (
              sum by (namespace) (rate(starlette_responses_total{app="clog-backend",path_template!~"/metrics|/health/.*",status_code=~"5.."}[5m]))
              /
              sum by (namespace) (rate(starlette_responses_total{app="clog-backend",path_template!~"/metrics|/health/.*"}[5m]))
            ) > 0.05
            and
            sum by (namespace) (increase(starlette_responses_total{app="clog-backend",path_template!~"/metrics|/health/.*",status_code=~"5.."}[5m])) >= 3
          for: 5m
          labels:
            severity: critical
            category: service
          annotations:
            summary: "clog-backend 5xx 에러율 5% 초과"
            description: "최근 5분 에러율 {{`{{ $value | humanizePercentage }}`}}"
        
        # p95 응답시간 > 1초 (헬스체크·/metrics 제외 — 빠른 요청이 p95 를 끌어내림)
        # 실제 지표 이름은 starlette_requests_processing_time_seconds (예전 이름은 존재하지 않았음)
        - alert: ClogHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (namespace, le) (rate(starlette_requests_processing_time_seconds_bucket{app="clog-backend",path_template!~"/metrics|/health/.*"}[5m]))
            ) > 1.0
          for: 5m
          labels:
            severity: warning
            category: service
          annotations:
            summary: "clog-backend p95 응답시간 1초 초과"
            description: "p95 = {{`{{ $value }}`}}s (목표: 200ms 이하)"
        
        # Rate limit 비정상 폭증 (5분간 100건 이상)
        - alert: ClogRateLimitSurge
          expr: |
            sum by (namespace) (rate(starlette_responses_total{app="clog-backend",status_code="429"}[5m])) > 0.33
          for: 5m
          labels:
            severity: warning
            category: service
          annotations:
            summary: "clog-backend rate limit 발동 폭증"
            description: "5분간 429 응답 폭증 - DDoS 의심 또는 정상 트래픽 폭증"

        # 처리되지 않은 예외 1건이라도 → 알림. 에러율 룰(>=3건)이 놓치는 단발성 버그용.
        # 도메인 예외는 exception_handlers 가 4xx 로 바꾸고 catch-all 핸들러가 없어서,
        # 이 카운터는 "예상 못 한 예외"만 센다 → 1건 알림이어도 시끄럽지 않다.
        # 라벨 붙은 카운터는 첫 발생 때 값 1로 생겨서 increase() 가 그 1건을 못 센다
        # (= 처음 생긴 버그를 놓침). 그래서 10분 전엔 없던 새 시리즈도 or 로 잡는다.
        # 한계: Prometheus 가 10분 넘게 내려갔다 오면 기존 시리즈가 새것처럼 보여 1회 오탐 가능.
        - alert: ClogUnhandledException
          expr: |
            sum by (namespace, path_template, exception_type) (
              increase(starlette_exceptions_total{app="clog-backend"}[10m])
            ) > 0
            or
            sum by (namespace, path_template, exception_type) (
              starlette_exceptions_total{app="clog-backend"}
              unless
              starlette_exceptions_total{app="clog-backend"} offset 10m
            )
          for: 0m
          labels:
            severity: warning
            category: service
          annotations:
            summary: "clog-backend 처리되지 않은 예외 - {{`{{ $labels.namespace }}`}} {{`{{ $labels.path_template }}`}}"
            description: "{{`{{ $labels.exception_type }}`}} 발생(최근 10분). Loki 에서 {namespace=\"{{`{{ $labels.namespace }}`}}\"} |= \"Traceback\" 로 스택트레이스 확인."

        # 워커 컨테이너가 memcg OOM 으로 커널에 의해 강제 종료됨.
        # last_terminated_reason 은 다음 종료 전까지 안 꺼지는 게이지라,
        # 최근 재시작(increase>0)과 and 로 묶어 15분 지나면 자동 resolve 되게 한다.
        # on(...) 필수: last_terminated_reason 에만 reason 라벨이 있어 그냥 and 하면 라벨 집합이 달라
        # 절대 매칭 안 됨 (2026-07-27 추가 후 11-04 까지 발화 불가였음 — promtool 테스트로 발견).
        - alert: ClogWorkerOOMKilled
          expr: |
            increase(kube_pod_container_status_restarts_total{container="clog-worker"}[15m]) > 0
            and on (namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{container="clog-worker", reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: critical
            category: service
          annotations:
            summary: "clog-worker OOMKilled - {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}}"
            description: "워커 컨테이너가 메모리 한도 초과로 강제 종료됨. media_status=processing 에 멈춘 게시물이 있을 수 있음(media_stale_reconcile CronJob이 정리하지만 확인 필요)."

        # OOMKill 이전에 미리 감지 (사전 경고, limit 대비 90% 지속).
        # cadvisor/kube-state-metrics 스크레이프 중복으로 동일 (pod,namespace) 에
        # 여러 시리즈가 잡혀 many-to-one 매칭 에러가 나서, max by 로 dedupe 후 나눈다.
        - alert: ClogWorkerHighMemory
          expr: |
            (
              max by (pod, namespace) (container_memory_working_set_bytes{container="clog-worker"})
              /
              max by (pod, namespace) (kube_pod_container_resource_limits{container="clog-worker", resource="memory"})
            ) > 0.9
          for: 5m
          labels:
            severity: warning
            category: service
          annotations:
            summary: "clog-worker 메모리 사용량 90% 초과 - {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}}"
            description: "메모리 한도 근접(limit 대비 {{`{{ $value | humanizePercentage }}`}}), OOMKill 임박 가능성"
