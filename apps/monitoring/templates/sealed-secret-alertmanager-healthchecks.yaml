# Healthchecks.io dead-man switch ping URL (2026-11-12, H5·ADR-095) — Alertmanager Watchdog 수신처의 url_file.
# alertmanager.alertmanagerSpec.secrets 로 /etc/alertmanager/secrets/alertmanager-healthchecks/url 에 마운트.
# 원본: infra 저장소 uptime/ 의 terraform output watchdog_ping_url (체크를 다시 만들면 URL 이 바뀌므로 다시 봉인)
#   terraform output -raw watchdog_ping_url | kubectl create secret generic alertmanager-healthchecks -n monitoring \
#     --from-file=url=/dev/stdin --dry-run=client -o yaml | kubeseal --controller-namespace sealed-secrets -o yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-healthchecks
  namespace: monitoring
spec:
  encryptedData:
    url: 
  template:
    metadata:
      name: alertmanager-healthchecks
      namespace: monitoring
