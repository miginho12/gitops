# Grafana 관리자 계정 (2026-11-10, 감사 M10) — values 의 평문 adminPassword(공개 저장소) 대체.
# grafana.admin.existingSecret 으로 참조. 값 확인: kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
# Grafana 는 DB 최초 생성 때만 이 값을 쓴다 → 바꾼 뒤엔 grafana cli admin reset-admin-password 로 DB 에도 반영.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
