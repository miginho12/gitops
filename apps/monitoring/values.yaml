# ============================================================
# kube-prometheus-stack
# ============================================================
kube-prometheus-stack:
  # CRD 는 이미 클러스터에 있음 (이전 helm 의 잔여)
  crds:
    enabled: true

  # ────────────────────────────────────────
  # Grafana
  # ────────────────────────────────────────
  grafana:
    # 관리자 계정은 SealedSecret(templates/sealed-secret-grafana-admin.yaml)에서 (2026-11-10, 감사 M10).
    # 이전 평문 adminPassword 는 공개 저장소에 노출돼 있었다 — DB 재생성(IaC 재구축·PVC 유실) 시 그 값이 됐을 것.
    # sidecar(대시보드·데이터소스 리로드)도 같은 Secret 을 쓴다.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    service:
      type: NodePort
      nodePort: 30300
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: local-path

    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 500Mi
    
    # Loki datasource 자동 추가
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://monitoring-loki.monitoring.svc:3100
        access: proxy
        editable: false

  # ────────────────────────────────────────
  # Prometheus (PVC + 7일 retention, 상한 10GB)
  # 30일로 늘리지 않는 이유(2026-11-03 확인): 7일치 TSDB 약 4.1GB(하루 ~0.58GB)라
  # 디스크는 충분하지만, 메모리가 평소 790~825Mi·최대 약 930Mi로 이미 limit 1000Mi 근처.
  # 보존이 길어지면 compaction·긴 구간 조회 때 OOM 위험 → limit 을 올리면 노드 메모리
  # 압박(10/13 노드 NotReady 전례). 장기 가용성은 클러스터 밖 업타임 모니터로 본다.
  # ────────────────────────────────────────
  prometheus:
    service:
      type: NodePort
      nodePort: 30090
    prometheusSpec:
      retention: 7d
      retentionSize: "10GB"
      
      # PVC (k3s local-path)
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      
      # ServiceMonitor / PodMonitor 자동 발견 (clog-backend 도)
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      
      # 리소스 제한 (라즈베리파이 보호)
      resources:
        requests:
          memory: 400Mi
          cpu: 100m
        limits:
          memory: 1000Mi

  # ────────────────────────────────────────
  # AlertManager 🆕
  # ────────────────────────────────────────
  alertmanager:
    enabled: true
    service:
      type: NodePort
      nodePort: 30903
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
      resources:
        requests:
          memory: 80Mi
        limits:
          memory: 200Mi
    
    # 라우팅 + Discord webhook
    config:
      global:
        resolve_timeout: 5m
      
      route:
        group_by: ['alertname', 'severity']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: 'discord-infra'  # default fallback
        routes:
          - matchers:
              - alertname=~"Watchdog|InfoInhibitor|KubeProxyDown"
            receiver: 'null'
          - matchers:
              - alertname="KubePodCrashLooping"
              - pod=~"argocd-applicationset-controller.*"
            receiver: 'null'
          - matchers:
              - category="service"
            receiver: 'discord-service'
          - matchers:
              - category="infra"
            receiver: 'discord-infra'
      
      receivers:
        - name: 'null'
        - name: 'discord-infra'
          webhook_configs:
            - url: 'http://alertmanager-discord-infra:9094'
              send_resolved: true
        - name: 'discord-service'
          webhook_configs:
            - url: 'http://alertmanager-discord-service:9094'
              send_resolved: true

  # ────────────────────────────────────────
  # kubelet 수집 (k3s 중복 지표 제거)
  # k3s 는 apiserver·kubelet·scheduler 가 한 프로세스라 kubelet /metrics 에도
  # apiserver 지표가 그대로 노출된다 → apiserver job 과 중복(2026-11-04 약 4.1만 시리즈).
  # 룰·대시보드가 job="kubelet" 으로 쓰는 건 kubelet_*·storage_*·volume_*·rest_client_*·
  # process_*·go_* 뿐이라, 아래 4개 접두어만 버린다. 리스트는 덮어쓰기라 차트 기본 규칙도 함께 적음.
  # ────────────────────────────────────────
  kubelet:
    serviceMonitor:
      metricRelabelings:
        # 차트 기본값 (storage 버킷 축소)
        - action: drop
          sourceLabels: [__name__, le]
          regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        # apiserver job 이 이미 수집하는 지표
        - action: drop
          sourceLabels: [__name__]
          regex: (apiserver|etcd|workqueue|scheduler)_.*

  # ────────────────────────────────────────
  # 기본 컴포넌트들
  # ────────────────────────────────────────
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true

  # textfile collector: 호스트 파일로 내보낸 지표를 읽는다 (백업 외부 복제 신선도 — scripts/backup-export.sh).
  # 호스트 / 가 이미 /host/root 로 마운트돼 있어 볼륨 추가 없이 경로만 지정.
  # 디렉터리는 Pi 에서 1회 생성: sudo install -d -o miginho -g miginho -m 755 /var/lib/node_exporter/textfile_collector
  # extraArgs 는 덮어쓰기라 차트 기본 2개(filesystem 제외 규칙)를 그대로 옮겨 적음 — 빠지면 디스크 알림 오탐.
  prometheus-node-exporter:
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
  
  # 기본 K8s 알람 룰 활성 (CrashLoop, OOM, NotReady 등)
  defaultRules:
    create: true
    rules:
      alertmanager: true
      etcd: false        # k3s 는 sqlite 사용
      kubeProxy: true
      kubeSchedulerAlerting: false  # k3s 는 단일 노드
      kubeControllerManager: false


# ============================================================
# Loki (single-binary 모드, k3s + 라즈베리파이 친화)
# ============================================================
loki:
  deploymentMode: SingleBinary
  
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    # 48h 로 적어 뒀지만 compactor retention_enabled 가 없어 실제로는 삭제되지 않음
    # (2026-11-03 기준 3.1GB, 35일 전 로그 조회됨). 적용하려면 compactor 설정 필요.
    limits_config:
      retention_period: 48h
      reject_old_samples: true
      reject_old_samples_max_age: 48h
  
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 300Mi
  
  # 분산 모드용 컴포넌트 모두 비활성 (single-binary 라)
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
    lokiCanary:
      enabled: false
    serviceMonitor:
      enabled: true   # Prometheus 가 Loki 자신도 수집
  test:
    enabled: false


# ============================================================
# Promtail (DaemonSet - 모든 노드의 Pod 로그 수집)
# ============================================================
promtail:
  config:
    clients:
      - url: http://monitoring-loki.monitoring.svc:3100/loki/api/v1/push
    
    # Pod 메타데이터 (namespace, pod, container) 자동 첨부
    snippets:
      pipelineStages:
        - cri: {}
  
  resources:
    requests:
      memory: 50Mi
      cpu: 50m
    limits:
      memory: 150Mi
  
  # ServiceMonitor (Promtail 자신도 메트릭 노출)
  serviceMonitor:
    enabled: true
