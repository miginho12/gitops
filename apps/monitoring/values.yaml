# ============================================================
# kube-prometheus-stack
# ============================================================
kube-prometheus-stack:
  # CRD 는 이미 클러스터에 있음 (이전 helm 의 잔여)
  crds:
    enabled: true

  # ────────────────────────────────────────
  # Grafana
  # ────────────────────────────────────────
  grafana:
    # helm test hook(Pod·ConfigMap·SA) — ArgoCD 가 일반 리소스로 만들어 남을 수 있어 끈다(loki test 와 같은 이유, 2026-11-14)
    testFramework:
      enabled: false
    # 관리자 계정은 SealedSecret(templates/sealed-secret-grafana-admin.yaml)에서 (2026-11-10, 감사 M10).
    # 이전 평문 adminPassword 는 공개 저장소에 노출돼 있었다 — DB 재생성(IaC 재구축·PVC 유실) 시 그 값이 됐을 것.
    # sidecar(대시보드·데이터소스 리로드)도 같은 Secret 을 쓴다.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    service:
      type: NodePort
      nodePort: 30300
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: local-path

    # 2026-11-14 kps 92.17.0(Grafana 13.0.2 → 13.3.0-distroless) 이후 평소 ~376Mi(이전 ~176Mi), 시작 직후 최고 529Mi 로
    # 옛 limit 500Mi 를 넘음 → 다음 재시작 때 OOM 반복 위험. request 는 실제 사용량, limit 은 시작 최고치 여유.
    resources:
      requests:
        memory: 384Mi
        cpu: 50m
      limits:
        memory: 768Mi
    
    # Loki datasource 자동 추가
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://monitoring-loki.monitoring.svc:3100
        access: proxy
        editable: false

  # ────────────────────────────────────────
  # Prometheus (PVC + 7일 retention, 상한 10GB)
  # 30일로 늘리지 않는 이유(2026-11-03 확인): 7일치 TSDB 약 4.1GB(하루 ~0.58GB)라
  # 디스크는 충분하지만, 메모리가 평소 790~825Mi·최대 약 930Mi로 이미 limit 1000Mi 근처.
  # 보존이 길어지면 compaction·긴 구간 조회 때 OOM 위험 → limit 을 올리면 노드 메모리
  # 압박(10/13 노드 NotReady 전례). 장기 가용성은 클러스터 밖 업타임 모니터로 본다.
  # ────────────────────────────────────────
  prometheus:
    service:
      type: NodePort
      nodePort: 30090
    prometheusSpec:
      retention: 7d
      retentionSize: "10GB"
      
      # PVC (k3s local-path)
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      
      # ServiceMonitor / PodMonitor 자동 발견 (clog-backend 도)
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      
      # 리소스 제한 (라즈베리파이 보호)
      resources:
        requests:
          memory: 400Mi
          cpu: 100m
        limits:
          memory: 1000Mi

  # ────────────────────────────────────────
  # AlertManager 🆕
  # ────────────────────────────────────────
  alertmanager:
    enabled: true
    service:
      type: NodePort
      nodePort: 30903
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
      resources:
        requests:
          memory: 80Mi
        limits:
          memory: 200Mi
      # /etc/alertmanager/secrets/<이름>/ 에 마운트 — healthchecks 수신처의 url_file 이 읽는다(H5, ADR-095)
      secrets:
        - alertmanager-healthchecks

    # 라우팅 + Discord webhook
    config:
      global:
        resolve_timeout: 5m
      
      route:
        group_by: ['alertname', 'severity']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: 'discord-infra'  # default fallback
        routes:
          # dead-man switch(H5, ADR-095): 항상 firing 인 Watchdog 을 Healthchecks.io 로 주기적으로 보낸다.
          # 끊기면(Prometheus·Alertmanager·Pi·네트워크 정지) Healthchecks 가 Discord #uptime·메일로 알린다.
          # repeat_interval 5m 은 group_interval(1m) 단위로 평가 → 실제 5~6분 간격. Healthchecks 쪽은 timeout 10m + grace 5m.
          - matchers:
              - alertname="Watchdog"
            receiver: 'healthchecks'
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 5m
          - matchers:
              - alertname=~"InfoInhibitor|KubeProxyDown"
            receiver: 'null'
          - matchers:
              - alertname="KubePodCrashLooping"
              - pod=~"argocd-applicationset-controller.*"
            receiver: 'null'
          - matchers:
              - category="service"
            receiver: 'discord-service'
          - matchers:
              - category="infra"
            receiver: 'discord-infra'
      
      receivers:
        - name: 'null'
        - name: 'healthchecks'
          webhook_configs:
            # ping URL 은 공개 저장소에 두지 않는다 → SealedSecret(templates/sealed-secret-alertmanager-healthchecks.yaml)
            - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/url
              # Prometheus 가 죽어 Watchdog 이 resolved 되면 그 알림도 ping(=정상)으로 읽힌다 → 보내지 않는다
              send_resolved: false
        - name: 'discord-infra'
          webhook_configs:
            - url: 'http://alertmanager-discord-infra:9094'
              send_resolved: true
        - name: 'discord-service'
          webhook_configs:
            - url: 'http://alertmanager-discord-service:9094'
              send_resolved: true

  # ────────────────────────────────────────
  # kubelet 수집 (k3s 중복 지표 제거)
  # k3s 는 apiserver·kubelet·scheduler 가 한 프로세스라 kubelet /metrics 에도
  # apiserver 지표가 그대로 노출된다 → apiserver job 과 중복(2026-11-04 약 4.1만 시리즈).
  # 룰·대시보드가 job="kubelet" 으로 쓰는 건 kubelet_*·storage_*·volume_*·rest_client_*·
  # process_*·go_* 뿐이라, 아래 4개 접두어만 버린다. 리스트는 덮어쓰기라 차트 기본 규칙도 함께 적음.
  # ────────────────────────────────────────
  kubelet:
    serviceMonitor:
      metricRelabelings:
        # 차트 기본값 (storage 버킷 축소)
        - action: drop
          sourceLabels: [__name__, le]
          regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        # apiserver job 이 이미 수집하는 지표
        - action: drop
          sourceLabels: [__name__]
          regex: (apiserver|etcd|workqueue|scheduler)_.*

  # ────────────────────────────────────────
  # 기본 컴포넌트들
  # ────────────────────────────────────────
  kubeStateMetrics:
    enabled: true
  nodeExporter:
    enabled: true

  # textfile collector: 호스트 파일로 내보낸 지표를 읽는다 (백업 외부 복제 신선도 — scripts/backup-export.sh).
  # 호스트 / 가 이미 /host/root 로 마운트돼 있어 볼륨 추가 없이 경로만 지정.
  # 디렉터리는 Pi 에서 1회 생성: sudo install -d -o miginho -g miginho -m 755 /var/lib/node_exporter/textfile_collector
  # extraArgs 는 덮어쓰기라 차트 기본 2개(filesystem 제외 규칙)를 그대로 옮겨 적음 — 빠지면 디스크 알림 오탐.
  prometheus-node-exporter:
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
  
  # 기본 K8s 알람 룰 활성 (CrashLoop, OOM, NotReady 등)
  defaultRules:
    create: true
    rules:
      alertmanager: true
      etcd: false        # k3s 는 sqlite 사용
      kubeProxy: true
      kubeSchedulerAlerting: false  # k3s 는 단일 노드
      kubeControllerManager: false


# ============================================================
# Loki (single-binary 모드, k3s + 라즈베리파이 친화)
# ============================================================
loki:
  deploymentMode: SingleBinary
  
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    # 보존 7일 (2026-11-10, 감사 M5 — Prometheus 와 동일, 장애 추적 기준).
    # 이전엔 retention_period 만 있고 compactor retention_enabled 가 없어 한 번도 삭제되지 않았다
    # (11-10 기준 chunks 3.2GB 중 7일 초과 3.0GB). local-path PV 의 20Gi 는 강제되지 않는 값이라
    # 실제 상한은 노드 디스크 전체 → 보존 삭제가 유일한 보호. 동작 여부는 LokiCompactorNotRunning 알림이 본다.
    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 48h
    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h          # 삭제 표시 후 실제 삭제까지 유예
      retention_delete_worker_count: 50   # 기본 150 — Pi 부하 완화
      delete_request_store: filesystem    # retention_enabled 시 필수(Loki 3.x)
  
  # deploymentMode 는 SingleBinary 유지 — community 12.0 에서 Monolithic 으로 이름이 바뀌었지만 옛 이름도 지원.
  # 바꾸면 Pod 라벨(→ StatefulSet selector, 불변)이 달라질 수 있어 별도 작업으로(렌더 비교 후).
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path
    # 2026-11-14 limit 300Mi → 512Mi: 7일 최대 299Mi 로 이미 한계(평소 ~110Mi), Loki 3.7 이전과 함께 여유 확보
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
  
  # 분산 모드용 컴포넌트 모두 비활성 (single-binary 라)
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
    serviceMonitor:
      enabled: true   # Prometheus 가 Loki 자신도 수집
  # loki-6.x 에서 canary 키는 최상위(lokiCanary) — monitoring.lokiCanary 에 두면 무시돼 144일간
  # DaemonSet 이 떠서 시간당 ~1천 줄을 Loki 에 써 왔다 (2026-11-10, 감사 M5 에서 발견·정정).
  lokiCanary:
    enabled: false
  test:
    enabled: false
  # memberlist 주소를 Ready 전에도 내놓는다 — 기본 false 면 시작 중인 Pod 가 자기 자신도 못 찾아 합류를 재시도하고
  # (2026-11-14 첫 기동 6번째 시도·45초), 기동이 길어지면 abort_if_cluster_join_fails(10회) 로 스스로 종료·재시작 반복 위험.
  memberlist:
    service:
      publishNotReadyAddresses: true


# ============================================================
# Promtail (DaemonSet - 모든 노드의 Pod 로그 수집)
# ============================================================
promtail:
  config:
    clients:
      - url: http://monitoring-loki.monitoring.svc:3100/loki/api/v1/push
    
    # Pod 메타데이터 (namespace, pod, container) 자동 첨부
    snippets:
      pipelineStages:
        - cri: {}
  
  resources:
    requests:
      memory: 50Mi
      cpu: 50m
    limits:
      memory: 150Mi
  
  # ServiceMonitor (Promtail 자신도 메트릭 노출)
  serviceMonitor:
    enabled: true
