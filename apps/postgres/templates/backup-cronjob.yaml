{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "postgres.fullname" . }}-backup
  labels:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit | default 3 }}
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            {{- include "postgres.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: dump
              emptyDir: {}

          # 1) pg_dump로 덤프 떠서 emptyDir에 압축 저장
          initContainers:
            - name: pg-dump
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command:
                - sh
                - -c
                - |
                  set -eu
                  FILE="/dump/{{ include "postgres.fullname" . }}-{{ .Values.database.name }}-$(date -u +%Y%m%d-%H%M%S).sql.gz"
                  pg_dump -h {{ include "postgres.fullname" . }} -U {{ .Values.database.user }} -d {{ .Values.database.name }} | gzip > "$FILE"
                  echo "dumped $FILE ($(du -h "$FILE" | cut -f1))"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secret.name }}
                      key: {{ .Values.secret.keys.userPassword }}
              volumeMounts:
                - name: dump
                  mountPath: /dump
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}

          # 2) rclone으로 MinIO에 업로드 + 리텐션 정리
          containers:
            - name: upload
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy | default "IfNotPresent" }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  rclone mkdir "backup:{{ .Values.backup.minio.bucket }}"
                  rclone copy /dump/ "backup:{{ .Values.backup.minio.bucket }}/" --include "*.sql.gz"
                  rclone delete "backup:{{ .Values.backup.minio.bucket }}/" --min-age {{ .Values.backup.retentionDays }}d
                  rclone ls "backup:{{ .Values.backup.minio.bucket }}/"
              env:
                # rclone remote "backup"을 환경변수로 정의 (설정 파일 불필요)
                - name: RCLONE_CONFIG_BACKUP_TYPE
                  value: s3
                - name: RCLONE_CONFIG_BACKUP_PROVIDER
                  value: Minio
                - name: RCLONE_CONFIG_BACKUP_ENDPOINT
                  value: "http://{{ .Values.backup.minio.endpoint }}"
                - name: RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.minio.secretName }}
                      key: {{ .Values.backup.minio.accessKeyKey }}
                - name: RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.minio.secretName }}
                      key: {{ .Values.backup.minio.secretKeyKey }}
                # 이미지 기본 RCLONE_CONFIG 파일이 없어 매 명령마다 NOTICE 출력 → 메모리 설정만 사용
                - name: RCLONE_CONFIG
                  value: /dev/null
              volumeMounts:
                - name: dump
                  mountPath: /dump
                  readOnly: true
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
{{- end }}
