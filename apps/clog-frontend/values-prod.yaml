# prod 환경 override
# 2026-07-16: 백엔드(clog-prod) 준비 완료 후 프론트 prod 배포.
# 수동 승격 원칙 — dev에서 검증된 sha 태그를 그대로 반영 (재빌드 아님).
# 2026-07-17: Tailscale Funnel 전환 완료 — 이 NodePort(30083)가 공개 대상.
# dev(30081)는 Funnel에서 빠지고 tailnet 내부 전용으로 전환됨.
# 2026-07-30: 공개 도메인이 climb-log.com(Cloudflare Tunnel)으로 전환됨 —
# NodePort(30083) 자체는 그대로, 그 앞단 공개 경로만 바뀜.

image:
  tag: "sha-eb8c2ac"  # dev에서 검증된 태그를 그대로 승격 — 여러 기록 한 번에 올리기(/feed/batch) + 업로드 대기열(순차·실패분 재시도) + 카드별 들찍 대상 지정
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  # 백엔드(30082)와 dev 프론트(30081)에 안 겹치게
  nodePort: 30083

env:
  CLOG_BACKEND_HOST: "clog-prod"
