# prod 환경 override
# 2026-07-16: 백엔드(clog-prod) 준비 완료 후 프론트 prod 배포.
# 수동 승격 원칙 — dev에서 검증된 sha 태그를 그대로 반영 (재빌드 아님).
# 2026-07-17: Tailscale Funnel 전환 완료 — 이 NodePort(30083)가 공개 대상.
# dev(30081)는 Funnel에서 빠지고 tailnet 내부 전용으로 전환됨.
# 2026-07-30: 공개 도메인이 climb-log.com(Cloudflare Tunnel)으로 전환됨 —
# NodePort(30083) 자체는 그대로, 그 앞단 공개 경로만 바뀜.

# 2026-11-09 (감사 M9): 단일 Pod 였다 — Pod 하나가 죽거나 재시작되면 사이트 전체 다운.
# nginx 는 limit 128Mi·200m 라 하나 더 띄워도 노드 부담 작음.
replicaCount: 2

image:
  tag: "sha-3b98ba4"  # dev에서 검증된 태그를 그대로 승격 — L1 C-1: framer-motion 12.42.2→14.10.1(#19, 전환 10종 프레임 비교 동일, 2026-11-12). 이전 9e3b5aa: npm minor/patch 14개 + nginx 1.31(L1 A)
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  # 백엔드(30082)와 dev 프론트(30081)에 안 겹치게
  nodePort: 30083

env:
  CLOG_BACKEND_HOST: "clog-prod"
