# MinIO root 계정 — storage 네임스페이스 (2026-11-10, 감사 M4: dev 네임스페이스에서 이전, 같은 값 재봉인)
# SealedSecret 은 네임스페이스에 묶여 있어 이동 시 재봉인 필요. 키: root-user/root-password(+예전 앱 키 2개, 미사용)
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-credentials
  namespace: storage
spec:
  encryptedData:
    MINIO_ACCESS_KEY: 
    MINIO_SECRET_KEY: 
    root-password: 
    root-user: 
  template:
    metadata:
      name: minio-credentials
      namespace: storage
    type: Opaque
