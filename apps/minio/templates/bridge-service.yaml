# 옛 주소 호환 다리 (2026-11-10, 감사 M4) — MinIO 가 dev → storage 네임스페이스로 이전.
# 앱들이 아직 minio.dev.svc.cluster.local 을 가리키므로, 같은 이름의 ExternalName Service 로
# minio.storage.svc.cluster.local 에 CNAME 연결 → 전환 순간 앱 설정을 안 바꿔도 된다.
# 2단계(주소 정리)에서 모든 참조를 minio.storage 로 바꾼 뒤 이 파일을 삭제한다.
# 주의: nginx 는 시작 시 IP 를 고정하므로 전환 후 frontend 는 rollout restart 필요.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: dev
  labels:
    {{- include "minio.labels" . | nindent 4 }}
    app.kubernetes.io/component: bridge
spec:
  type: ExternalName
  externalName: {{ include "minio.name" . }}.{{ .Release.Namespace }}.svc.cluster.local
  ports:
    - name: api
      port: {{ .Values.service.apiPort }}
      protocol: TCP
